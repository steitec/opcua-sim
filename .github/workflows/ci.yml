name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # On Windows the event loop can end while asyncio's proactor is still closing a connection, and
      # its __del__ warnings fail pytest, even at exit after all tests passed. Linux and macOS stay strict.
      PYTEST_ADDOPTS: ${{ matrix.os == 'windows-latest' && '-p no:unraisableexception' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: pytest -v examples/test_example.py
      - run: pytest -v web/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the demo container
        working-directory: .
        run: |
          docker build -f web/Dockerfile -t opcua-sim-web .
          docker run -d --name web -p 8080:80 opcua-sim-web
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: web/test-results/
      - if: always()
        working-directory: .
        run: docker logs web; docker rm -f web
